{% extends "base.html" %}

{% block content %}
<div class="header-section">
    <h1>SECURE <span class="accent-text">CHECKOUT</span></h1>
    <p>Complete your purchase details below.</p>
</div>

<div class="checkout-container">
    <div class="checkout-form-box">
        <form id="checkout-form" action="{{ url_for('checkout') }}" method="POST">
            <div class="form-group">
                <label>Shipping Address</label>
                <textarea name="address" rows="4" required placeholder="Enter delivery address..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_method" required>
                    <option value="">Select a method...</option>
                    <option value="Virtual Account">Virtual Account</option>
                    <option value="QRIS">QRIS</option>
                    <option value="Credit Card">Credit Card</option>
                </select>
            </div>
            
            <div class="checkout-summary">
                <h3>Total Amount: <span class="accent-text">${{ "{:,}".format(total_price) }}</span></h3>
            </div>
            
            <button type="submit" id="btn-pay" class="btn-primary">PROCESS PAYMENT</button>
        </form>
        
        <div id="loading-overlay" class="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <h2 class="accent-text" style="font-family: var(--font-heading);">Processing Payment Gateway...</h2>
            <p>Please wait while we secure your transaction.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        document.getElementById('loading-overlay').style.display = 'flex';
        
        setTimeout(function() {
            document.getElementById('checkout-form').submit();
        }, 2500);
    });
</script>
{% endblock %}
