{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2><span class="accent-text">LOGIN</span></h2>
    <form action="{{ url_for('login') }}" method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Access System</button>
    </form>
    <p class="auth-redirect">Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
</div>
{% endblock %}
